  <text x="340" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="500" fill="#15304C">Verifiko</text>
  <text x="340" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6B7A85">Confianza en cada servicio</text>
